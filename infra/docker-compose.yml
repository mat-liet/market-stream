x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------- core ----

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: ms-kafka
    profiles: [core]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # --- KRaft: no ZooKeeper, single node acting as both broker and controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MarketStreamKRaftCluster1
      # --- RF=1 is a local-only simplification (design doc 11.6).
      #     The transaction-state settings below are what make Streams EOS v2
      #     work on a single broker; without them the processor fails to start.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # --- Topics are created explicitly by kafka-init (design doc 24.2):
      #     broker auto-create would use the wrong partition count and retention.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    logging: *default-logging

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    container_name: ms-schema-registry
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # BACKWARD is the compatibility gate from design doc 18 scenario 12:
      # a schema-incompatible producer is rejected at registration, not at runtime.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  kafka-init:
    image: confluentinc/cp-kafka:7.9.0
    container_name: ms-kafka-init
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka-init/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP_SERVER: kafka:29092
    restart: "no"
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ms-clickhouse
    profiles: [core]
    ports:
      - "127.0.0.1:8123:8123"   # HTTP
      - "127.0.0.1:9000:9000"   # native
    environment:
      CLICKHOUSE_DB: market
      CLICKHOUSE_USER: market
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-market}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: ms-postgres
    profiles: [core]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  # Migrations run on every `make up`, not just first boot: docker-entrypoint-initdb.d
  # only fires against an empty volume, which would silently skip every schema change
  # made after the first startup.

  flyway:
    image: flyway/flyway:11
    container_name: ms-flyway
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/migrations:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://postgres:5432/market
      - -user=market
      - -password=${POSTGRES_PASSWORD:-market}
      - -connectRetries=10
      - -baselineOnMigrate=true
      - migrate
    restart: "no"
    logging: *default-logging

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    container_name: ms-clickhouse-init
    profiles: [core]
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse/migrate.sh:/migrate.sh:ro
      - ./clickhouse/migrations:/migrations:ro
    entrypoint: ["/bin/bash", "/migrate.sh"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: market
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-market}
    restart: "no"
    logging: *default-logging

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.5
    container_name: ms-console
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://schema-registry:8081
    logging: *default-logging

  # ------------------------------------------------------------ services ----
  #
  # Kept in their own profile so `make up` stays a fast infrastructure-only loop: while
  # working on a service you run it from the IDE against this stack, and only bring the
  # containerised copy up when testing the deployed shape.

  kraken-ingestor:
    build:
      context: ..
      dockerfile: kraken-ingestor/Dockerfile
    image: market-stream/kraken-ingestor:0.1.0-SNAPSHOT
    container_name: ms-kraken-ingestor
    profiles: [services]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_URL: jdbc:postgresql://postgres:5432/market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market}
      KRAKEN_WS_URL: wss://ws.kraken.com/v2
      METRICS_PORT: 9101
    ports:
      # Bound to loopback like every other published port: this is a local stack with no
      # authentication in front of it.
      - "127.0.0.1:9101:9101"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9101/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  market-processor:
    build:
      context: ..
      dockerfile: market-processor/Dockerfile
    image: market-stream/market-processor:0.1.0-SNAPSHOT
    container_name: ms-market-processor
    profiles: [services]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_URL: jdbc:postgresql://postgres:5432/market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market}
      METRICS_PORT: 9102
    ports:
      - "127.0.0.1:9102:9102"
    volumes:
      # RocksDB state and the changelog offsets that go with it. Losing this is survivable —
      # Streams restores from the changelog topics — but a restore is slow and pointless to
      # repeat on every restart.
      - processor-state:/var/lib/market-processor
    healthcheck:
      # /health reports the Streams state, so a topology that is alive but ERROR or
      # PENDING_SHUTDOWN fails the check rather than looking fine.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9102/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # ------------------------------------------------------- observability ----

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ms-prometheus
    profiles: [observability]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.5.0
    container_name: ms-grafana
    profiles: [observability]
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    logging: *default-logging

volumes:
  kafka-data:
  clickhouse-data:
  postgres-data:
  processor-state:
  prometheus-data:
  grafana-data:
