# Scrape config for the four services (design doc 21.1).
#
# The service targets below do not exist yet — they are added by M2-M6. Prometheus
# reports them as down until then, which is the correct signal rather than a
# missing scrape job.

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kraken-ingestor
    metrics_path: /metrics
    static_configs:
      - targets: ["kraken-ingestor:9101"]
        labels:
          service: kraken-ingestor

  - job_name: market-processor
    metrics_path: /metrics
    static_configs:
      - targets: ["market-processor:9102"]
        labels:
          service: market-processor

  - job_name: persistence-sink
    metrics_path: /metrics
    static_configs:
      - targets: ["persistence-sink:9103"]
        labels:
          service: persistence-sink

  - job_name: market-api
    metrics_path: /q/metrics
    static_configs:
      - targets: ["market-api:8080"]
        labels:
          service: market-api
